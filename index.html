<!doctype html>

<title>Praise &amp; Reks — Wedding Garden</title>

<body>

</main>

<button id="pause" class="glass" type="button" aria-label="Pause movement" aria-pressed="false">

</button>

<button id="cta-invite" class="glass hang" type="button">View Invitation</button>
<button id="cta-gallery" class="glass hang" type="button">Open Gallery</button>
<button id="cta-story" class="glass hang" type="button">Read Full Story</button>

<div class="modal" id="story" role="dialog" aria-modal="true" aria-labelledby="story-t"><div class="sheet"><button class="close" type="button" aria-label="Close">&times;</button><div class="body"><h2 id="story-t">Our Story</h2><div id="storytext"></div></div></div></div>
<div class="modal" id="gallery" role="dialog" aria-modal="true" aria-labelledby="gal-t"><div class="sheet wide"><button class="close" type="button" aria-label="Close">&times;</button><div class="body"><h2 id="gal-t">Our Gallery</h2><div id="galgrid" class="grid"></div></div></div></div>
